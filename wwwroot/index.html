<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir (POS) - Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden !important; }
      #thermalReceipt, #thermalReceipt * { visibility: visible !important; }
      #thermalReceipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
        margin: 0;
        padding: 6px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        line-height: 1.3;
        background: #fff;
        color: #000;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 h-full flex flex-col font-sans antialiased">

  <!-- Shared Header Injected by nav.js -->
  <div id="sharedHeader"></div>

  <!-- Main POS Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex-1 w-full flex flex-col min-h-0">
    <section class="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1 min-h-0">
      
      <!-- Kolom Kiri: Produk & Pencarian (7 Kolom) -->
      <div class="lg:col-span-7 xl:col-span-8 flex flex-col min-h-0 space-y-2.5">
        
        <!-- Search & Filter Bar -->
        <div class="bg-white p-2.5 rounded-lg border border-slate-200 flex flex-col sm:flex-row gap-2">
          <div class="relative flex-1">
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Cari nama produk / scan barcode [F2]..." 
              class="w-full px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-emerald-600 focus:bg-white"
              oninput="handleSearchInput(this.value)"
              onkeydown="handleSearchKeydown(event)"
              autocomplete="off"
            >
            <button 
              id="clearSearchBtn" 
              onclick="clearSearch()" 
              class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-xs text-slate-400 hover:text-slate-700">
              Reset
            </button>
          </div>

          <!-- Filter Stok Cepat -->
          <div class="flex items-center space-x-1 shrink-0 text-xs">
            <button onclick="setProductFilter('all')" id="filterAll" class="px-2.5 py-1.5 rounded-md font-semibold bg-slate-900 text-white">Semua</button>
            <button onclick="setProductFilter('available')" id="filterAvail" class="px-2.5 py-1.5 rounded-md font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">Tersedia</button>
            <button onclick="setProductFilter('low')" id="filterLow" class="px-2.5 py-1.5 rounded-md font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700">Stok Kritis</button>
          </div>
        </div>

        <!-- Info Bar -->
        <div class="flex items-center justify-between text-xs text-slate-500 px-0.5">
          <span>Menampilkan <span id="productCounter" class="font-bold text-slate-800">0</span> produk</span>
          <span class="text-slate-400 text-[11px]">Tekan Enter di pencarian untuk langsung tambah ke keranjang</span>
        </div>

        <!-- Grid Produk -->
        <div class="flex-1 overflow-y-auto pr-0.5 min-h-[380px] max-h-[calc(100vh-230px)]">
          <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-2.5">
            <!-- Data via JS -->
          </div>
        </div>

      </div>

      <!-- Kolom Kanan: Keranjang & Pembayaran (5 Kolom) -->
      <div class="lg:col-span-5 xl:col-span-4 flex flex-col">
        <div class="bg-white rounded-lg border border-slate-200 flex flex-col h-full overflow-hidden">
          
          <div class="px-3.5 py-2.5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
            <h2 class="font-bold text-slate-800 text-sm">Keranjang Transaksi</h2>
            <button 
              onclick="clearCart()" 
              id="btnClearCart" 
              class="text-xs text-rose-600 hover:text-rose-800 font-semibold hidden">
              Kosongkan
            </button>
          </div>

          <!-- List Item Keranjang -->
          <div id="cartList" class="flex-1 overflow-y-auto p-3 space-y-2 min-h-[140px] max-h-[280px]">
            <!-- Render via JS -->
          </div>

          <!-- Panel Pembayaran & Numpad Touch -->
          <div class="border-t border-slate-200 bg-slate-50 p-3.5 space-y-2.5 mt-auto">
            
            <div class="space-y-1 text-xs">
              <div class="flex justify-between text-slate-600">
                <span>Total Item:</span>
                <span id="totalItems" class="font-bold text-slate-900">0</span>
              </div>
              <div class="flex justify-between items-baseline pt-1 border-t border-slate-200">
                <span class="font-bold text-slate-700">Total Tagihan:</span>
                <span id="totalAmount" class="text-xl font-black text-slate-900">Rp 0</span>
              </div>
            </div>

            <!-- Input Pembayaran -->
            <div class="space-y-1">
              <div class="flex justify-between text-xs">
                <label for="cashPaidInput" class="font-medium text-slate-700">Uang Diterima [F4]:</label>
                <div class="flex gap-2">
                  <button type="button" onclick="toggleNumpad()" id="btnNumpadToggle" class="text-slate-600 hover:text-slate-900 text-[11px] font-medium underline">
                    Tutup Numpad
                  </button>
                  <button type="button" onclick="setQuickCash('exact')" class="text-emerald-700 hover:underline font-semibold text-[11px]">
                    Uang Pas
                  </button>
                </div>
              </div>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center text-slate-400 text-xs font-bold">Rp</span>
                <input 
                  type="number" 
                  id="cashPaidInput" 
                  placeholder="0" 
                  class="w-full pl-8 pr-3 py-1.5 bg-white border border-slate-300 rounded-md text-sm font-bold text-slate-900 focus:outline-none focus:ring-1 focus:ring-emerald-600" 
                  oninput="calculateChange()"
                  onkeydown="handleCashKeydown(event)"
                  min="0"
                >
              </div>
            </div>

            <!-- Tombol Pecahan Cepat -->
            <div id="quickCashButtons" class="grid grid-cols-4 gap-1.5 text-xs"></div>

            <!-- On-screen POS Keypad -->
            <div id="posNumpad" class="grid grid-cols-4 gap-1 text-xs select-none">
              <button onclick="pressNumpad('7')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">7</button>
              <button onclick="pressNumpad('8')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">8</button>
              <button onclick="pressNumpad('9')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">9</button>
              <button onclick="pressNumpad('back')" class="py-1.5 bg-slate-200 border border-slate-300 rounded font-bold hover:bg-slate-300 active:bg-slate-400 text-slate-700">⌫</button>

              <button onclick="pressNumpad('4')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">4</button>
              <button onclick="pressNumpad('5')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">5</button>
              <button onclick="pressNumpad('6')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">6</button>
              <button onclick="pressNumpad('clear')" class="py-1.5 bg-rose-50 border border-rose-200 rounded font-bold hover:bg-rose-100 active:bg-rose-200 text-rose-700">C</button>

              <button onclick="pressNumpad('1')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">1</button>
              <button onclick="pressNumpad('2')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">2</button>
              <button onclick="pressNumpad('3')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">3</button>
              <button onclick="pressNumpad('00')" class="py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">00</button>

              <button onclick="pressNumpad('0')" class="col-span-2 py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">0</button>
              <button onclick="pressNumpad('000')" class="col-span-2 py-1.5 bg-white border border-slate-200 rounded font-bold hover:bg-slate-100 active:bg-slate-200 text-slate-800">000</button>
            </div>

            <!-- Nilai Kembalian -->
            <div class="p-2 bg-white border border-slate-200 rounded flex justify-between items-center text-xs">
              <span class="text-slate-600 font-medium">Kembalian:</span>
              <span id="changeAmount" class="font-extrabold text-slate-400 text-sm">Rp 0</span>
            </div>

            <!-- Tombol Checkout -->
            <button 
              onclick="processCheckout()" 
              id="btnCheckout" 
              class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold text-xs rounded-md transition disabled:opacity-40 disabled:cursor-not-allowed" 
              disabled>
              Selesaikan Transaksi (Enter)
            </button>

          </div>
        </div>
      </div>

    </section>
  </main>

  <!-- Modal Struk Cetak -->
  <div id="receiptModal" class="fixed inset-0 bg-slate-950/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-xs w-full p-4 shadow-lg border border-slate-200 space-y-3">
      <div id="thermalReceipt" class="bg-white p-3 border border-dashed border-slate-300 rounded font-mono text-xs text-slate-900 space-y-2">
        <div class="text-center pb-2 border-b border-dashed border-slate-300">
          <h4 id="receiptStoreName" class="font-bold text-sm tracking-wide">KASIR POS</h4>
          <p id="receiptStoreAddress" class="text-[10px] text-slate-500"></p>
          <div class="mt-1 text-[10px] text-slate-500 flex justify-between">
            <span id="receiptTrxId">#0</span>
            <span id="receiptDate">-</span>
          </div>
        </div>
        <div id="receiptItems" class="space-y-1 py-1 text-[11px]"></div>
        <div class="border-t border-dashed border-slate-300 pt-2 space-y-1 text-xs">
          <div class="flex justify-between font-bold"><span>TOTAL:</span><span id="receiptTotal">Rp 0</span></div>
          <div class="flex justify-between text-slate-600"><span>TUNAI:</span><span id="receiptPaid">Rp 0</span></div>
          <div class="flex justify-between text-slate-600"><span>KEMBALI:</span><span id="receiptChange">Rp 0</span></div>
        </div>
        <div class="text-center pt-2 text-[10px] text-slate-500 border-t border-dashed border-slate-300">
          Terima kasih atas kunjungan Anda.
        </div>
      </div>
      <div class="flex space-x-2 pt-1 no-print">
        <button onclick="window.print()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold text-xs">Cetak Struk</button>
        <button onclick="closeReceiptModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-semibold text-xs">Tutup</button>
      </div>
    </div>
  </div>

  <script src="/js/nav.js"></script>
  <script>
    if (checkAuthGuard('pos')) {
      renderSharedHeader('pos');
    }

    let products = [];
    let cart = [];
    let activeFilter = 'all';
    let showNumpad = true;

    async function loadProducts(query = '') {
      try {
        const url = query ? `${API_BASE}/products?search=${encodeURIComponent(query)}` : `${API_BASE}/products`;
        const res = await fetch(url, { headers: getHeaders() });
        products = await res.json();
        renderProductGrid();
      } catch (err) { showToast('Gagal memuat katalog', 'error'); }
    }

    let searchTimer = null;
    function handleSearchInput(val) {
      document.getElementById('clearSearchBtn').classList.toggle('hidden', !val);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadProducts(val.trim()), 200);
    }

    function clearSearch() {
      const inp = document.getElementById('searchInput');
      inp.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      loadProducts();
      inp.focus();
    }

    function handleSearchKeydown(e) {
      if (e.key === 'Enter') {
        const val = e.target.value.trim().toLowerCase();
        if (!val) return;
        let found = products.find(p => p.barcode && p.barcode.toLowerCase() === val);
        if (!found && products.length === 1) found = products[0];
        if (found) { addToCart(found.id); clearSearch(); }
        else if (products.length > 1) { addToCart(products[0].id); clearSearch(); }
        else { showToast('Produk tidak ditemukan', 'error'); }
      }
    }

    function setProductFilter(type) {
      activeFilter = type;
      ['all', 'available', 'low'].forEach(t => {
        const el = document.getElementById('filter' + (t === 'all' ? 'All' : t === 'available' ? 'Avail' : 'Low'));
        el.className = t === type ? 'px-2.5 py-1.5 rounded-md font-semibold bg-slate-900 text-white' : 'px-2.5 py-1.5 rounded-md font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700';
      });
      renderProductGrid();
    }

    function renderProductGrid() {
      const grid = document.getElementById('productGrid');
      let filtered = products;
      if (activeFilter === 'available') filtered = products.filter(p => p.stock > 0);
      else if (activeFilter === 'low') filtered = products.filter(p => p.stock > 0 && p.stock <= 5);

      document.getElementById('productCounter').innerText = filtered.length;
      if (!filtered.length) {
        grid.innerHTML = '<div class="col-span-full py-12 text-center text-slate-400 text-xs">Produk tidak ditemukan</div>';
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const out = p.stock <= 0;
        const low = p.stock > 0 && p.stock <= 5;
        return `
          <div onclick="${out ? '' : `addToCart(${p.id})`}" class="bg-white p-3 rounded-md border border-slate-200 hover:border-emerald-600 cursor-pointer transition flex flex-col justify-between select-none active:scale-[0.98] ${out ? 'opacity-40 cursor-not-allowed' : ''}">
            <div>
              <div class="flex justify-between items-center text-[10px] text-slate-400 mb-1 font-mono">
                <span>${p.barcode || '-'}</span>
                ${out ? '<span class="text-rose-600 font-bold">Habis</span>' : low ? `<span class="text-amber-700 font-bold">Sisa ${p.stock}</span>` : ''}
              </div>
              <h4 class="font-bold text-slate-800 text-xs line-clamp-2 leading-tight">${escapeHtml(p.name)}</h4>
            </div>
            <div class="mt-2.5 pt-2 border-t border-slate-100 flex justify-between items-baseline">
              <span class="font-black text-slate-900 text-xs">${formatRp(p.price)}</span>
              ${!out && !low ? `<span class="text-[11px] text-slate-400 font-medium">${p.stock}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(productId) {
      const prod = products.find(p => p.id === productId);
      if (!prod) return;
      const item = cart.find(c => c.product.id === productId);
      const curQty = item ? item.quantity : 0;
      if (curQty + 1 > prod.stock) {
        showToast(`Stok "${prod.name}" tersisa ${prod.stock}`, 'error');
        return;
      }
      if (item) item.quantity++;
      else cart.push({ product: prod, quantity: 1 });
      renderCart(productId);
    }

    function updateCartQty(productId, delta) {
      const idx = cart.findIndex(c => c.product.id === productId);
      if (idx === -1) return;
      const newQty = cart[idx].quantity + delta;
      if (newQty <= 0) cart.splice(idx, 1);
      else {
        if (newQty > cart[idx].product.stock) {
          showToast(`Stok maksimal ${cart[idx].product.stock}`, 'error');
          return;
        }
        cart[idx].quantity = newQty;
      }
      renderCart(productId);
    }

    function setCartQtyDirect(productId, val) {
      const idx = cart.findIndex(c => c.product.id === productId);
      if (idx === -1) return;
      let parsed = parseInt(val) || 1;
      if (parsed <= 0) cart.splice(idx, 1);
      else if (parsed > cart[idx].product.stock) {
        parsed = cart[idx].product.stock;
        showToast(`Stok maksimal ${cart[idx].product.stock}`, 'error');
        cart[idx].quantity = parsed;
      } else {
        cart[idx].quantity = parsed;
      }
      renderCart(productId);
    }

    function removeCartItem(productId) {
      cart = cart.filter(c => c.product.id !== productId);
      renderCart();
    }

    function clearCart() {
      if (!cart.length) return;
      if (confirm('Kosongkan keranjang belanja?')) { cart = []; renderCart(); }
    }

    function renderCart(highlightId = null) {
      const list = document.getElementById('cartList');
      document.getElementById('btnClearCart').classList.toggle('hidden', cart.length === 0);

      if (!cart.length) {
        list.innerHTML = '<div class="h-full flex flex-col items-center justify-center py-10 text-center text-slate-400 text-xs">Keranjang kosong</div>';
      } else {
        list.innerHTML = cart.map(item => `
          <div id="cartItem-${item.product.id}" class="p-2 rounded bg-slate-50 border ${item.product.id === highlightId ? 'border-emerald-500 bg-emerald-50/40' : 'border-slate-200'} flex items-center justify-between gap-2 transition duration-200">
            <div class="flex-1 min-w-0">
              <h5 class="text-xs font-bold text-slate-800 truncate">${escapeHtml(item.product.name)}</h5>
              <div class="flex items-center gap-1.5 text-[11px] mt-0.5">
                <span class="text-slate-500">${formatRp(item.product.price)}</span>
                <span class="text-slate-300">×</span>
                <span class="font-bold text-slate-800">${formatRp(item.product.price * item.quantity)}</span>
              </div>
            </div>
            <div class="flex items-center space-x-1 shrink-0">
              <button onclick="updateCartQty(${item.product.id}, -1)" class="w-5 h-5 rounded bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold">-</button>
              <input type="number" value="${item.quantity}" min="1" max="${item.product.stock}" onchange="setCartQtyDirect(${item.product.id}, this.value)" class="w-9 text-center text-xs font-bold py-0.5 border border-slate-300 rounded bg-white focus:outline-none">
              <button onclick="updateCartQty(${item.product.id}, 1)" class="w-5 h-5 rounded bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold">+</button>
              <button onclick="removeCartItem(${item.product.id})" class="w-5 h-5 ml-1 text-slate-400 hover:text-rose-600 text-xs font-bold">&times;</button>
            </div>
          </div>
        `).join('');
      }

      const totalItems = cart.reduce((acc, c) => acc + c.quantity, 0);
      const totalAmount = cart.reduce((acc, c) => acc + (c.quantity * c.product.price), 0);
      document.getElementById('totalItems').innerText = totalItems;
      document.getElementById('totalAmount').innerText = formatRp(totalAmount);
      updateQuickCashButtons(totalAmount);
      calculateChange();
    }

    function toggleNumpad() {
      showNumpad = !showNumpad;
      document.getElementById('posNumpad').classList.toggle('hidden', !showNumpad);
      document.getElementById('btnNumpadToggle').innerText = showNumpad ? 'Tutup Numpad' : 'Buka Numpad';
    }

    function pressNumpad(key) {
      const input = document.getElementById('cashPaidInput');
      let cur = input.value.toString();
      if (cur === '0') cur = '';
      if (key === 'clear') input.value = '';
      else if (key === 'back') input.value = cur.slice(0, -1);
      else input.value = cur + key;
      calculateChange();
      input.focus();
    }

    function updateQuickCashButtons(total) {
      const container = document.getElementById('quickCashButtons');
      if (total <= 0) {
        container.innerHTML = `
          <button onclick="setQuickCash('exact')" class="py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 font-semibold text-slate-700">Pas</button>
          <button onclick="setQuickCash(20000)" class="py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 font-semibold text-slate-700">20rb</button>
          <button onclick="setQuickCash(50000)" class="py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 font-semibold text-slate-700">50rb</button>
          <button onclick="setQuickCash(100000)" class="py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 font-semibold text-slate-700">100rb</button>
        `;
        return;
      }
      const roundUp = (val, step) => Math.ceil(val / step) * step;
      const suggestions = new Set([total]);
      if (total < 50000) suggestions.add(50000);
      if (total < 100000) suggestions.add(100000);
      if (total > 100000) { suggestions.add(roundUp(total, 50000)); suggestions.add(roundUp(total, 100000)); }
      const arr = Array.from(suggestions).filter(x => x >= total).sort((a,b) => a-b).slice(0, 4);

      container.innerHTML = arr.map(amt => `
        <button onclick="setQuickCash(${amt})" class="py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 font-semibold text-slate-700">
          ${amt === total ? 'Pas' : amt >= 1000 ? (amt / 1000) + 'rb' : amt}
        </button>
      `).join('');
    }

    function calculateChange() {
      const totalAmount = cart.reduce((acc, c) => acc + (c.quantity * c.product.price), 0);
      const cashPaid = parseFloat(document.getElementById('cashPaidInput').value) || 0;
      const change = cashPaid - totalAmount;
      const changeElem = document.getElementById('changeAmount');
      const btnCheckout = document.getElementById('btnCheckout');

      if (totalAmount > 0 && cashPaid >= totalAmount) {
        changeElem.innerText = formatRp(change);
        changeElem.className = 'font-extrabold text-emerald-700 text-sm';
        btnCheckout.disabled = false;
      } else {
        changeElem.innerText = cashPaid > 0 && totalAmount > 0 ? 'Kurang ' + formatRp(Math.abs(change)) : 'Rp 0';
        changeElem.className = cashPaid > 0 && totalAmount > 0 ? 'font-bold text-rose-600 text-xs' : 'font-extrabold text-slate-400 text-sm';
        btnCheckout.disabled = true;
      }
    }

    function setQuickCash(val) {
      const total = cart.reduce((acc, c) => acc + (c.quantity * c.product.price), 0);
      const input = document.getElementById('cashPaidInput');
      input.value = val === 'exact' ? total : val;
      calculateChange();
      input.focus();
    }

    function handleCashKeydown(e) {
      if (e.key === 'Enter') {
        const btn = document.getElementById('btnCheckout');
        if (!btn.disabled) processCheckout();
      }
    }

    async function processCheckout() {
      const totalAmount = cart.reduce((acc, c) => acc + (c.quantity * c.product.price), 0);
      const cashPaid = parseFloat(document.getElementById('cashPaidInput').value) || 0;
      if (!cart.length || cashPaid < totalAmount) return;

      const payload = {
        items: cart.map(c => ({ productId: c.product.id, quantity: c.quantity })),
        cashPaid: cashPaid
      };

      const btn = document.getElementById('btnCheckout');
      btn.disabled = true;
      btn.innerText = 'Menyimpan...';

      try {
        const res = await fetch(`${API_BASE}/transactions`, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json();
          showToast(errData.message || 'Gagal transaksi', 'error');
          btn.disabled = false;
          btn.innerText = 'Selesaikan Transaksi (Enter)';
          return;
        }

        const trx = await res.json();
        showToast('Transaksi selesai', 'success');
        showReceipt(trx);
        cart = [];
        document.getElementById('cashPaidInput').value = '';
        renderCart();
        loadProducts();
      } catch (err) {
        showToast('Kesalahan jaringan: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Selesaikan Transaksi (Enter)';
      }
    }

    function showReceipt(trx) {
      document.getElementById('receiptTrxId').innerText = `#${trx.id}`;
      document.getElementById('receiptDate').innerText = new Date(trx.createdAt).toLocaleString('id-ID');
      document.getElementById('receiptItems').innerHTML = trx.items.map(i => `
        <div class="flex justify-between items-start py-0.5">
          <div class="pr-2">
            <div>${escapeHtml(i.productName)}</div>
            <div class="text-[10px] text-slate-500">${i.quantity} x ${formatRp(i.unitPrice)}</div>
          </div>
          <span class="font-semibold text-right">${formatRp(i.subtotal)}</span>
        </div>
      `).join('');
      document.getElementById('receiptTotal').innerText = formatRp(trx.totalAmount);
      document.getElementById('receiptPaid').innerText = formatRp(trx.cashPaid);
      document.getElementById('receiptChange').innerText = formatRp(trx.changeAmount);

      const modal = document.getElementById('receiptModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeReceiptModal() {
      const modal = document.getElementById('receiptModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.getElementById('searchInput')?.focus();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'F2') { e.preventDefault(); document.getElementById('searchInput')?.focus(); }
      else if (e.key === 'F4') { e.preventDefault(); document.getElementById('cashPaidInput')?.focus(); }
      else if (e.key === 'Escape') { closeReceiptModal(); }
    });

    loadProducts();
  </script>
</body>
</html>
