<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Transaksi - Kasir POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body * { visibility: hidden !important; }
      #thermalReceipt, #thermalReceipt * { visibility: visible !important; }
      #thermalReceipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
        margin: 0;
        padding: 6px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        line-height: 1.3;
        background: #fff;
        color: #000;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 h-full flex flex-col font-sans antialiased">

  <div id="sharedHeader"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex-1 w-full flex flex-col min-h-0 space-y-3">
    
    <div class="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center gap-2">
      <div class="relative w-72">
        <input 
          type="text" 
          id="historySearchInput" 
          placeholder="Filter ID transaksi atau nama item..." 
          class="w-full px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-xs text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-emerald-600 focus:bg-white"
          oninput="filterHistoryTable(this.value)"
        >
      </div>

      <button 
        onclick="loadHistory()" 
        class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition">
        Muat Ulang
      </button>
    </div>

    <div class="bg-white rounded-lg border border-slate-200 overflow-hidden flex-1 flex flex-col">
      <div class="overflow-x-auto flex-1">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold">
              <th class="p-3 pl-4">ID</th>
              <th class="p-3">Waktu</th>
              <th class="p-3">Item Terjual</th>
              <th class="p-3 text-right">Total</th>
              <th class="p-3 text-right">Tunai</th>
              <th class="p-3 text-right">Kembali</th>
              <th class="p-3 pr-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Modal Struk -->
  <div id="receiptModal" class="fixed inset-0 bg-slate-950/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg max-w-xs w-full p-4 shadow-lg border border-slate-200 space-y-3">
      <div id="thermalReceipt" class="bg-white p-3 border border-dashed border-slate-300 rounded font-mono text-xs text-slate-900 space-y-2">
        <div class="text-center pb-2 border-b border-dashed border-slate-300">
          <h4 id="receiptStoreName" class="font-bold text-sm tracking-wide">KASIR POS</h4>
          <p id="receiptStoreAddress" class="text-[10px] text-slate-500"></p>
          <div class="mt-1 text-[10px] text-slate-500 flex justify-between">
            <span id="receiptTrxId">#0</span>
            <span id="receiptDate">-</span>
          </div>
        </div>
        <div id="receiptItems" class="space-y-1 py-1 text-[11px]"></div>
        <div class="border-t border-dashed border-slate-300 pt-2 space-y-1 text-xs">
          <div class="flex justify-between font-bold"><span>TOTAL:</span><span id="receiptTotal">Rp 0</span></div>
          <div class="flex justify-between text-slate-600"><span>TUNAI:</span><span id="receiptPaid">Rp 0</span></div>
          <div class="flex justify-between text-slate-600"><span>KEMBALI:</span><span id="receiptChange">Rp 0</span></div>
        </div>
        <div class="text-center pt-2 text-[10px] text-slate-500 border-t border-dashed border-slate-300">
          Terima kasih atas kunjungan Anda.
        </div>
      </div>
      <div class="flex space-x-2 pt-1 no-print">
        <button onclick="window.print()" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold text-xs">Cetak Struk</button>
        <button onclick="closeReceiptModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-semibold text-xs">Tutup</button>
      </div>
    </div>
  </div>

  <script src="/js/nav.js"></script>
  <script>
    if (checkAuthGuard('history')) {
      renderSharedHeader('history');
    }

    let rawTransactions = [];

    async function loadHistory() {
      try {
        const res = await fetch(`${API_BASE}/transactions`, { headers: getHeaders() });
        rawTransactions = await res.json();
        renderHistoryTable(rawTransactions);
      } catch (err) { showToast('Gagal memuat riwayat', 'error'); }
    }

    function filterHistoryTable(q) {
      const query = q.trim().toLowerCase();
      if (!query) { renderHistoryTable(rawTransactions); return; }
      renderHistoryTable(rawTransactions.filter(t => t.id.toString().includes(query) || (t.items && t.items.some(i => i.productName.toLowerCase().includes(query)))));
    }

    function renderHistoryTable(list) {
      const tbody = document.getElementById('historyTableBody');
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-slate-400">Belum ada riwayat transaksi</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(trx => {
        const itemCount = trx.items?.reduce((acc, i) => acc + i.quantity, 0) || 0;
        const itemSummary = trx.items?.map(i => `${i.productName} (${i.quantity})`).join(', ') || '-';
        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 pl-4 font-mono font-bold text-slate-600">#${trx.id}</td>
            <td class="p-3 text-slate-600">${new Date(trx.createdAt).toLocaleString('id-ID')}</td>
            <td class="p-3 text-slate-700 max-w-xs truncate" title="${escapeHtml(itemSummary)}">
              <span class="font-bold text-slate-900">${itemCount} item:</span> <span class="text-slate-500">${escapeHtml(itemSummary)}</span>
            </td>
            <td class="p-3 text-right font-black text-slate-900">${formatRp(trx.totalAmount)}</td>
            <td class="p-3 text-right text-slate-600">${formatRp(trx.cashPaid)}</td>
            <td class="p-3 text-right font-bold text-emerald-700">${formatRp(trx.changeAmount)}</td>
            <td class="p-3 pr-4 text-center">
              <button onclick='showReceipt(${JSON.stringify(trx)})' class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-semibold text-[11px]">Struk</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function showReceipt(trx) {
      document.getElementById('receiptTrxId').innerText = `#${trx.id}`;
      document.getElementById('receiptDate').innerText = new Date(trx.createdAt).toLocaleString('id-ID');
      document.getElementById('receiptItems').innerHTML = trx.items.map(i => `
        <div class="flex justify-between items-start py-0.5">
          <div class="pr-2">
            <div>${escapeHtml(i.productName)}</div>
            <div class="text-[10px] text-slate-500">${i.quantity} x ${formatRp(i.unitPrice)}</div>
          </div>
          <span class="font-semibold text-right">${formatRp(i.subtotal)}</span>
        </div>
      `).join('');
      document.getElementById('receiptTotal').innerText = formatRp(trx.totalAmount);
      document.getElementById('receiptPaid').innerText = formatRp(trx.cashPaid);
      document.getElementById('receiptChange').innerText = formatRp(trx.changeAmount);

      const modal = document.getElementById('receiptModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeReceiptModal() {
      const modal = document.getElementById('receiptModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeReceiptModal();
    });

    loadHistory();
  </script>
</body>
</html>
